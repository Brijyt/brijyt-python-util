[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brijyt-python-util"
version = "0.2.2"
description = "Shared Python utilities for Brijyt APIs: JSON logging, correlation ID, middleware."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
